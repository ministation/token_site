<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-станция</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/png" href="/static/coin.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="/static/coin.png" alt="Coin">
                <h1>Мини-станция</h1>
            </div>
            <div id="userInfo">
                <button id="loginBtn" onclick="login()">
                    <img src="/static/discord.png" alt="" class="btn-icon">
                    Войти через Discord
                </button>
                <div id="userPanel" style="display:none;"></div>
            </div>
        </div>

        <div class="nav-bar">
            <button type="button" class="nav-toggle" id="navToggle" aria-label="Меню" aria-expanded="false">
                <i class="fa-solid fa-bars"></i> Меню
            </button>
            <nav class="main-nav" id="mainNav" aria-label="Основная навигация">
            <button class="nav-btn active" data-section="home"><i class="fa-solid fa-house"></i> Главная</button>
            <button class="nav-btn" data-section="economy"><i class="fa-solid fa-coins"></i> Монетки</button>
            <button class="nav-btn" data-section="bans"><i class="fa-solid fa-gavel"></i> Наказания</button>
            <button class="nav-btn" data-section="online"><i class="fa-solid fa-chart-line"></i> Статистика</button>
            <button class="nav-btn" data-section="messages"><i class="fa-solid fa-envelope"></i> Сообщения</button>
            </nav>
        </div>

        <div id="homeSection" class="section active">
            {% include 'partials/home.html' %}
        </div>
        <div id="economySection" class="section">
            {% include 'partials/economy.html' %}
        </div>
        <div id="bansSection" class="section">
            {% include 'partials/bans.html' %}
        </div>
        <div id="onlineSection" class="section">
            {% include 'partials/online.html' %}
        </div>
        <div id="messagesSection" class="section">
            {% include 'partials/messages.html' %}
        </div>

        <datalist id="playersList"></datalist>
    </div>

    <script>
        const API_BASE = '';
        const COIN_ICON = '<img src="/static/coin.png" class="coin-icon-result" alt="">';
        let currentUser = null;
        let currentPlayerId = null;

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function apiCall(method, url, body = null) {
            const options = { method, headers: {} };
            if (body) {
                if (body instanceof FormData) {
                    options.body = body;
                } else {
                    options.headers['Content-Type'] = 'application/json';
                    options.body = JSON.stringify(body);
                }
            }
            const res = await fetch(`${API_BASE}${url}`, options);
            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.detail || 'Ошибка запроса');
            }
            return await res.json();
        }
    </script>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/navigation.js"></script>
    <script src="/static/js/bank.js"></script>
    <script src="/static/js/social.js"></script>
    <script src="/static/js/bans.js"></script>
    <script src="/static/js/online.js"></script>
    <script src="/static/js/messages.js"></script>
    <script src="/static/script.js"></script>

    <script>
    let playtimeChart = null;

    async function loadPlaytimeChart() {
        try {
            const res = await fetch('/api/playtime-stats');
            const data = await res.json();
            const ctx = document.getElementById('playtimeCanvas');
            if (!ctx) return;
            if (playtimeChart) playtimeChart.destroy();
            const total = (data.newbies || 0) + (data.regulars || 0) + (data.veterans || 0);
            const totalEl = document.getElementById('playtimeTotal');
            if (totalEl) totalEl.textContent = 'Всего: ' + total + ' игроков (с онлайном > 5 ч)';
            playtimeChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: [
                        'Новички (<50ч): ' + (data.newbies || 0),
                        'Обычные (50–400ч): ' + (data.regulars || 0),
                        'Ветераны (400+ч): ' + (data.veterans || 0)
                    ],
                    datasets: [{
                        data: [data.newbies || 0, data.regulars || 0, data.veterans || 0],
                        backgroundColor: ['#6ecf8a', '#e8c060', '#e88a9a'],
                        borderColor: 'rgba(10, 10, 20, 0.5)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#c4b5e0', padding: 10, font: { size: 11 }, boxWidth: 12 }
                        }
                    }
                }
            });
        } catch (e) {
            console.error('Chart error:', e);
        }
    }

    async function loadServerStatus() {
        try {
            const res = await fetch('/api/server-status');
            const data = await res.json();

            const dot = document.getElementById('statusDot');
            if (dot) dot.className = 'status-dot' + (data.online ? ' online' : '');

            const nameEl = document.getElementById('statusName');
            if (nameEl) nameEl.textContent = data.name || 'Мини-станция';

            const playersEl = document.getElementById('statusPlayers');
            if (playersEl) playersEl.textContent = data.players || 0;

            const maxEl = document.getElementById('statusMax');
            if (maxEl) maxEl.textContent = data.max_players || 100;

            const mapEl = document.getElementById('statusMap');
            if (mapEl) mapEl.textContent = data.map || '-';

            const presetEl = document.getElementById('statusPreset');
            if (presetEl) presetEl.textContent = data.preset || '-';

            const fill = document.getElementById('progressFill');
            if (fill) {
                const percent = Math.min(100, ((data.players || 0) / (data.max_players || 100)) * 100);
                fill.style.width = percent + '%';
            }
        } catch (e) {}
    }

    loadServerStatus();
    loadPlaytimeChart();
    setInterval(loadServerStatus, 30000);
    </script>
</body>
</html>
