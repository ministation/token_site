<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — Мини-станция</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Exo+2:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/ambient.js" defer></script>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/ui-refresh.css">
    <link rel="icon" type="image/png" href="/static/coin.png">
</head>
<body>
    <div class="bg-ambient" aria-hidden="true">
        <div class="bg-parallax-layer" data-depth="22">
            <div class="bg-glow bg-glow--1"></div>
            <div class="bg-glow bg-glow--2"></div>
        </div>
        <div class="bg-parallax-layer bg-dust-field" data-depth="34"></div>
    </div>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="logo">
                <img src="/static/logo.png" alt="Логотип" onerror="this.src='/static/coin.png'">
                <h1>Мини<span>-</span>станция</h1>
            </div>
            <div id="userInfo">
                <button type="button" class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Сменить тему">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button id="loginBtn" onclick="window.location.href='/login'">
                    <i class="fa-brands fa-discord"></i>
                    Войти через Discord
                </button>
                <div id="userPanel" style="display:none;"></div>
            </div>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <div class="side-group">
                <div class="side-group-title"><i class="fa-solid fa-compass"></i> Навигация</div>
                <a class="side-link" href="/"><i class="fa-solid fa-house"></i> На главную</a>
            </div>
            <div class="side-group">
                <div class="side-group-title"><i class="fa-solid fa-link"></i> Ссылки</div>
                <a class="side-link" href="http://cdn.ministation.ru/" target="_blank" rel="noopener"><i class="fa-solid fa-cloud"></i> CDN</a>
                <a class="side-link" href="https://wiki.ministation.ru" target="_blank" rel="noopener"><i class="fa-solid fa-book"></i> Вики</a>
                <a class="side-link" href="https://discord.gg/mini-station" target="_blank" rel="noopener"><i class="fa-brands fa-discord"></i> Discord</a>
            </div>
        </aside>

        <main class="content">
            <div id="profileContent"></div>
        </main>
    </div>

    <script>
        const API_BASE = '';
        let currentUser = null;

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function checkAuth() {
            try {
                const res = await fetch('/api/me');
                const data = await res.json();
                currentUser = data;
                if (data.authenticated) {
                    document.getElementById('loginBtn').style.display = 'none';
                    const panel = document.getElementById('userPanel');
                    panel.style.display = 'flex';
                    panel.innerHTML = `
                        ${data.avatar ? `<img src="${data.avatar}" alt="" onerror="this.style.display='none'">` : ''}
                        <span>${escapeHtml(data.display_name || data.username)}</span>
                        <button onclick="window.location.href='/logout'">Выйти</button>
                    `;
                }
            } catch(e) {}
        }

        async function loadProfile(playerId) {
            try {
                const resp = await fetch(`/api/social/profile/${playerId}`);
                if (!resp.ok) {
                    document.getElementById('profileContent').innerHTML = '<div class="card"><h2>Профиль не найден</h2></div>';
                    return;
                }
                const p = await resp.json();
                const avatarUrl = p.discord_avatar || '/static/default_avatar.png';
                const isOwn = currentUser?.player?.player_id === p.player_id;

                document.getElementById('profileContent').innerHTML = `
                    <div class="card">
                        <h2><i class="fa-solid fa-user"></i> Профиль игрока</h2>
                        <div class="profile-header">
                            <img src="${avatarUrl}" class="profile-avatar" onerror="this.src='/static/default_avatar.png'">
                            <div class="profile-info">
                                <h2>${escapeHtml(p.game_nickname || 'Игрок')}</h2>
                                <p class="profile-username">@${escapeHtml(p.discord_username || 'Не привязан')}</p>
                                <div class="profile-stats">
                                    <div class="profile-stat">
                                        <div class="profile-stat-value">${p.followers_count||0}</div>
                                        <div class="profile-stat-label">Подписчиков</div>
                                    </div>
                                    <div class="profile-stat">
                                        <div class="profile-stat-value">${p.following_count||0}</div>
                                        <div class="profile-stat-label">Подписок</div>
                                    </div>
                                </div>
                                <div class="profile-actions">
                                    ${!isOwn ? `
                                        <button class="follow-btn ${p.is_following?'unfollow':''}" onclick="toggleFollow(${JSON.stringify(p.player_id)}, this)">
                                            ${p.is_following?'Отписаться':'Подписаться'}
                                        </button>
                                        <button class="message-btn" onclick="sendMessageTo(${JSON.stringify(p.player_id)}, this.dataset.nick)" data-nick="${escapeHtml(p.game_nickname || 'Игрок')}">
                                            <i class="fa-solid fa-envelope"></i> Написать
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                        ${p.bio ? `<div class="profile-bio">${escapeHtml(p.bio)}</div>` : ''}
                    </div>
                `;
            } catch(e) {
                document.getElementById('profileContent').innerHTML = '<div class="card"><h2>Ошибка загрузки</h2></div>';
            }
        }

        async function toggleFollow(targetId, btn) {
            const isFollowing = btn.classList.contains('unfollow');
            const method = isFollowing ? 'DELETE' : 'POST';
            try {
                await fetch(`/api/social/follow/${targetId}`, { method });
                const playerId = window.location.pathname.split('/').pop();
                loadProfile(playerId);
            } catch(e) { alert('Ошибка'); }
        }

        async function sendMessageTo(playerId, nickname) {
            sessionStorage.setItem('openPm', JSON.stringify({ playerId, nickname }));
            window.location.href = '/';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();
            const playerId = window.location.pathname.split('/').pop();
            await loadProfile(playerId);
        });
    </script>
</body>
</html>
