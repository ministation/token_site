<div class="card">
    <h2><i class="fa-solid fa-envelope"></i> Личные сообщения</h2>

    <div class="pm-new-dialog">
        <input type="text" id="pmUserSearch" placeholder="Найти игрока по нику..." autocomplete="off">
        <div id="pmUserResults" class="pm-user-results"></div>
    </div>

    <div class="messages-layout">
        <div class="dialogs-list" id="dialogsList">
            <p class="empty-state">Загрузка...</p>
        </div>
        <div class="chat-area">
            <div class="conversation-header" id="conversationTitle">Выберите диалог</div>
            <div id="currentConversation" class="chat-messages pm-messages"></div>
            <div class="chat-input-area">
                <textarea id="pmInput" placeholder="Сообщение..." rows="2"></textarea>
                <button onclick="sendPrivateMessage()"><i class="fa-solid fa-paper-plane"></i> Отправить</button>
            </div>
        </div>
    </div>
</div>
