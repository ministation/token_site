<div class="card messages-page">
    <div class="messages-page-header">
        <h2><i class="fa-solid fa-envelope"></i> Личные сообщения</h2>
        <p class="messages-hint">Напишите любому авторизованному игроку</p>
    </div>

    <div class="messages-layout" id="messagesLayout">
        <aside class="messages-sidebar" id="messagesSidebar">
            <div class="pm-search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="pmUserSearch" placeholder="Найти игрока..." autocomplete="off">
            </div>
            <div id="pmUserResults" class="pm-user-results pm-user-results-inline"></div>
            <div class="dialogs-list" id="dialogsList">
                <p class="empty-state">Загрузка...</p>
            </div>
        </aside>
        <div class="chat-area pm-chat-area" id="pmChatArea">
            <div class="conversation-header" id="conversationTitle">
                <button type="button" class="pm-back-btn" id="pmBackBtn" onclick="closePmConversation()" aria-label="Назад">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <span class="conversation-title-text"><i class="fa-solid fa-comments"></i> Выберите диалог</span>
            </div>
            <div id="currentConversation" class="chat-messages pm-messages"></div>
            <div class="chat-input-area pm-input-area">
                <textarea id="pmInput" placeholder="Напишите сообщение..." rows="2"
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendPrivateMessage();}"></textarea>
                <button type="button" onclick="sendPrivateMessage()" title="Отправить">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
</div>
