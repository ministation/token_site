<div class="card messages-page dc-shell">
    <div class="messages-page-header dc-channel-header">
        <h2><i class="fa-solid fa-at"></i> личные-сообщения</h2>
        <p class="messages-hint">Диалоги слева · переписка как в Discord</p>
    </div>

    <div class="messages-layout" id="messagesLayout">
        <aside class="messages-sidebar" id="messagesSidebar">
            <div class="pm-search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="pmUserSearch" placeholder="Найти игрока..." autocomplete="off">
            </div>
            <div id="pmUserResults" class="pm-user-results pm-user-results-inline"></div>
            <div class="dialogs-list" id="dialogsList">
                <p class="empty-state">Загрузка...</p>
            </div>
        </aside>
        <div class="chat-area pm-chat-area" id="pmChatArea">
            <div class="conversation-header" id="conversationTitle">
                <button type="button" class="pm-back-btn" id="pmBackBtn" onclick="closePmConversation()" aria-label="Назад">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <span class="conversation-title-text"><i class="fa-solid fa-comments"></i> Выберите диалог</span>
            </div>
            <div id="currentConversation" class="chat-messages pm-messages dc-messages"></div>
            <div class="chat-input-area pm-input-area chat-composer">
                <div class="chat-composer-tools">
                    <button type="button" class="chat-tool-btn" id="pmEmojiBtn" title="Эмодзи">
                        <i class="fa-regular fa-face-smile"></i>
                    </button>
                    <label class="chat-tool-btn" title="Изображение">
                        <i class="fa-solid fa-image"></i>
                        <input type="file" id="pmImage" accept="image/*" hidden>
                    </label>
                </div>
                <div class="chat-composer-main">
                    <textarea id="pmInput" placeholder="Написать сообщение" rows="1"
                        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendPrivateMessage();}"></textarea>
                    <div id="pmImagePreview" class="chat-image-preview" hidden></div>
                    <div id="pmEmojiPicker" class="emoji-picker" hidden></div>
                </div>
                <button type="button" class="chat-send-btn" onclick="sendPrivateMessage()" title="Отправить">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
</div>
