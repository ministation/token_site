<div class="card admin-panel">
    <h2><i class="fa-solid fa-shield-halved"></i> Админ-панель</h2>
    <p class="admin-hint">Управление сайтом — только для администраторов</p>

    <div class="admin-tabs">
        <button type="button" class="tab active" onclick="showAdminTab('stats', this)">Статистика</button>
        <button type="button" class="tab" onclick="showAdminTab('users', this)">Игроки</button>
        <button type="button" class="tab" onclick="showAdminTab('posts', this)">Форум</button>
        <button type="button" class="tab" onclick="showAdminTab('appeals', this)">Обжалования</button>
        <button type="button" class="tab" onclick="showAdminTab('bans', this)">Все баны</button>
        <button type="button" class="tab" onclick="showAdminTab('admins', this)">Staff</button>
    </div>

    <div id="adminStatsTab" class="admin-tab-content">
        <div id="adminStatsContent"><p class="empty-state">Загрузка...</p></div>
    </div>

    <div id="adminUsersTab" class="admin-tab-content" style="display:none;">
        <div class="admin-inline-form">
            <input type="text" id="adminUserSearch" placeholder="Поиск по нику..." oninput="debounceAdminUserSearch()">
        </div>
        <div id="adminUsersContent"><p class="empty-state">Загрузка...</p></div>
        <div class="bans-load-more">
            <button type="button" onclick="loadAdminUsers(true)"><i class="fa-solid fa-angles-down"></i> Загрузить ещё</button>
        </div>
    </div>

    <div id="adminPostsTab" class="admin-tab-content" style="display:none;">
        <div id="adminPostsList"><p class="empty-state">Загрузка...</p></div>
        <div class="bans-load-more">
            <button type="button" onclick="loadAdminPostsList(true)"><i class="fa-solid fa-angles-down"></i> Загрузить ещё</button>
        </div>
    </div>

    <div id="adminAppealsTab" class="admin-tab-content" style="display:none;">
        <div class="admin-inline-form">
            <select id="adminAppealFilter" onchange="loadAdminAppeals(false)">
                <option value="">Все</option>
                <option value="pending" selected>Ожидают</option>
                <option value="approved">Одобрены</option>
                <option value="rejected">Отклонены</option>
            </select>
        </div>
        <div id="adminAppealsContent"><p class="empty-state">Загрузка...</p></div>
    </div>

    <div id="adminBansTab" class="admin-tab-content" style="display:none;">
        <div id="adminBansContent"><p class="empty-state">Загрузка...</p></div>
        <div class="bans-load-more">
            <button type="button" onclick="loadAdminBans(true)"><i class="fa-solid fa-angles-down"></i> Загрузить ещё</button>
        </div>
    </div>

    <div id="adminAdminsTab" class="admin-tab-content" style="display:none;">
        <div class="admin-inline-form">
            <input type="text" id="adminGrantUsername" placeholder="Discord-ник">
            <select id="adminGrantRole">
                <option value="admin">Администратор</option>
                <option value="moderator">Модератор</option>
            </select>
            <button type="button" onclick="grantAdmin()"><i class="fa-solid fa-user-plus"></i> Назначить</button>
        </div>
        <div id="adminGrantResult" class="result"></div>
        <div id="adminListContent"><p class="empty-state">Загрузка...</p></div>
    </div>
</div>
