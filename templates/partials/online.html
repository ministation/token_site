<div class="card">
    <h2><i class="fa-solid fa-chart-line"></i> Статистика</h2>

    <div class="playtime-compact stats-playtime">
        <h3><i class="fa-solid fa-chart-pie"></i> Постоянные игроки <small>(от 5 ч)</small></h3>
        <div class="playtime-chart-wrap stats-chart-wrap">
            <canvas id="playtimeCanvas"></canvas>
        </div>
        <p class="playtime-total" id="playtimeTotal"></p>
    </div>

    <div class="admin-rating-section">
        <h3 class="stats-subtitle"><i class="fa-solid fa-star"></i> Рейтинг администрации AHelp</h3>
        <p class="admin-rating-hint">Сортировка: сначала с оценками (по убыванию), затем без оценок по нику</p>
        <div id="adminRatingList" class="admin-rating-list">
            <p class="empty-state">Загрузка...</p>
        </div>
    </div>

    <h3 class="stats-subtitle"><i class="fa-solid fa-signal"></i> Онлайн сервера</h3>

    <div class="chart-controls">
        <button class="chart-tab active" data-mode="day" onclick="switchOnlineMode('day', this)">День</button>
        <button class="chart-tab" data-mode="week" onclick="switchOnlineMode('week', this)">Неделя</button>
        <button class="chart-tab" data-mode="month" onclick="switchOnlineMode('month', this)">Месяц</button>
        <button class="chart-tab" data-mode="weekly-hours" onclick="switchOnlineMode('weekly-hours', this)">По часам</button>
        <input type="date" id="dayPicker" onchange="loadDailyOnline(this.value)">
    </div>

    <div class="chart-canvas-wrap">
        <canvas id="onlineChart"></canvas>
    </div>
    <p class="chart-hint">Данные обновляются каждые 5 минут. Средний и пиковый онлайн.</p>
</div>
