<div class="home-dashboard">
    <div class="status-strip card" id="serverStatus">
        <span class="status-dot" id="statusDot"></span>
        <div class="status-strip-main">
            <span class="status-name" id="statusName">Загрузка...</span>
            <span class="status-players">
                <strong id="statusPlayers">0</strong><span class="status-sep">/</span><span id="statusMax">100</span>
            </span>
        </div>
        <div class="status-bar-wrap">
            <div class="status-bar" id="progressFill"></div>
        </div>
        <div class="status-meta-row">
            <span class="status-meta"><i class="fa-solid fa-map"></i> <span id="statusMap">-</span></span>
            <span class="status-meta"><i class="fa-solid fa-bullseye"></i> <span id="statusPreset">-</span></span>
        </div>
    </div>

    <div class="playtime-compact card">
        <h3><i class="fa-solid fa-chart-pie"></i> Постоянные <small>(от 5 ч)</small></h3>
        <div class="playtime-chart-wrap">
            <canvas id="playtimeCanvas"></canvas>
        </div>
        <p class="playtime-total" id="playtimeTotal"></p>
    </div>
</div>

<div class="card hero-card hero-compact">
    <span class="tagline">Космическая станция 14</span>
    <p class="description">
        Мини-станция — некоммерческий безбашенный проект в SS14: эпичные баталии и ролевой отыгрыш.
    </p>
    <div class="social-links">
        <a href="https://ministation.ru/" target="_blank" rel="noopener" class="link-btn website">
            <i class="fa-solid fa-globe"></i> Сайт
        </a>
        <a href="https://discord.gg/mini-station" target="_blank" rel="noopener" class="link-btn discord">
            <i class="fa-brands fa-discord"></i> Discord
        </a>
        <a href="https://t.me/mini_station" target="_blank" rel="noopener" class="link-btn telegram">
            <i class="fa-brands fa-telegram"></i> Telegram
        </a>
        <a href="https://wiki.ministation.ru" target="_blank" rel="noopener" class="link-btn wiki">
            <i class="fa-solid fa-book"></i> Wiki
        </a>
        <a href="https://boosty.to/mini-station/" target="_blank" rel="noopener" class="link-btn boosty">
            <i class="fa-solid fa-heart"></i> Boosty
        </a>
        <a href="https://github.com/ministation/mini-station-goob" target="_blank" rel="noopener" class="link-btn github">
            <i class="fa-brands fa-github"></i> GitHub
        </a>
    </div>
</div>

<div class="card create-post-card">
    <h2><i class="fa-solid fa-pen"></i> Новый пост</h2>
    <div class="post-form">
        <textarea id="postContent" placeholder="Что у вас нового?"></textarea>
        <input type="file" id="postImage" accept="image/*">
        <div class="form-actions">
            <label for="postImage" class="image-upload-label">
                <i class="fa-solid fa-paperclip"></i> Добавить фото
            </label>
            <button onclick="createPost()"><i class="fa-solid fa-paper-plane"></i> Опубликовать</button>
        </div>
        <div id="imagePreview" class="image-preview"></div>
    </div>
</div>
<div id="feedContainer"></div>
