<div id="profileContent" class="card profile-page-card">
    <p class="empty-state">Загрузка профиля...</p>
</div>

<div id="inventoryPanels">
    <div class="card inventory-card">
        <h2><i class="fa-solid fa-box-open"></i> Инвентарь</h2>
        <p class="inventory-hint">Подписка, билеты на антагов и custom ghost</p>

        <div class="profile-avatar-section" id="avatarSection" style="display:none;">
            <h3><i class="fa-solid fa-user-circle"></i> Аватар</h3>
            <div class="avatar-upload-row">
                <img id="profileAvatarPreview" src="/static/default_avatar.png" alt="" class="profile-avatar-preview">
                <div>
                    <input type="file" id="avatarUpload" accept="image/png,image/jpeg,image/webp,image/gif">
                    <button type="button" onclick="uploadAvatar()"><i class="fa-solid fa-upload"></i> Сменить аватар</button>
                    <p class="avatar-hint">Сохраняется на сервере</p>
                </div>
            </div>
            <div id="avatarUploadResult" class="result"></div>
        </div>

        <div id="inventoryContent">
            <p class="empty-state">Загрузка...</p>
        </div>

        <div class="inventory-section playtime-transfer-section" id="playtimeTransferSection" hidden>
            <h3><i class="fa-solid fa-clock"></i> Перенос времени на роли</h3>
            <p class="inventory-hint">Выберите должность с наигранным временем и перенесите часы на другую роль.</p>

            <div id="playtimeKeeperFields" class="playtime-keeper-fields" hidden>
                <label class="playtime-label" for="playtimePlayerNick">Игрок (ник в игре)</label>
                <div class="playtime-keeper-row">
                    <input type="text" id="playtimePlayerNick" placeholder="ckey / ник">
                    <button type="button" onclick="loadPlaytimeJobs()"><i class="fa-solid fa-magnifying-glass"></i> Найти</button>
                </div>
            </div>

            <p class="playtime-player-title" id="playtimePlayerTitle" hidden></p>

            <div class="playtime-transfer-layout">
                <div class="playtime-col">
                    <h4 class="playtime-col-title"><i class="fa-solid fa-circle-minus"></i> Откуда</h4>
                    <p class="playtime-col-hint">Роли с наигранным временем</p>
                    <div id="playtimeFromJobs" class="playtime-jobs-pick"></div>
                </div>
                <div class="playtime-transfer-arrow" aria-hidden="true">
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
                <div class="playtime-col">
                    <h4 class="playtime-col-title"><i class="fa-solid fa-circle-plus"></i> Куда</h4>
                    <input type="text" id="playtimeToSearch" class="playtime-search" placeholder="Поиск роли..." oninput="filterPlaytimeToRoles()">
                    <div id="playtimeToJobs" class="playtime-jobs-pick playtime-jobs-pick-scroll"></div>
                </div>
            </div>

            <div class="playtime-amount-row">
                <label class="playtime-label" for="playtimeMinutes">Сколько перенести (минут)</label>
                <div class="playtime-amount-controls">
                    <input type="number" id="playtimeMinutes" min="1" step="1" placeholder="60">
                    <button type="button" class="playtime-quick-btn" onclick="setPlaytimeMinutes(30)">30м</button>
                    <button type="button" class="playtime-quick-btn" onclick="setPlaytimeMinutes(60)">1ч</button>
                    <button type="button" class="playtime-quick-btn" onclick="setPlaytimeMinutes(180)">3ч</button>
                    <button type="button" class="playtime-quick-btn" onclick="setPlaytimeMinutes(600)">10ч</button>
                    <button type="button" class="playtime-submit-btn" onclick="submitPlaytimeTransfer()">
                        <i class="fa-solid fa-right-left"></i> Перенести
                    </button>
                </div>
            </div>
            <div id="playtimeTransferResult" class="result"></div>
        </div>
    </div>
</div>
