{# Open Graph + Twitter Card — превью ссылки в Discord / Telegram / VK / X #}
<meta name="description" content="{{ og_description }}">
<meta name="theme-color" content="#f0780a">
<link rel="canonical" href="{{ og_url }}">

<meta property="og:type" content="{{ og_type|default('website') }}">
<meta property="og:site_name" content="{{ og_site_name }}">
<meta property="og:locale" content="{{ og_locale|default('ru_RU') }}">
<meta property="og:title" content="{{ og_title }}">
<meta property="og:description" content="{{ og_description }}">
<meta property="og:url" content="{{ og_url }}">
<meta property="og:image" content="{{ og_image }}">
<meta property="og:image:secure_url" content="{{ og_image }}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ og_image_alt }}">

<meta name="twitter:card" content="{{ twitter_card|default('summary_large_image') }}">
<meta name="twitter:title" content="{{ og_title }}">
<meta name="twitter:description" content="{{ og_description }}">
<meta name="twitter:image" content="{{ og_image }}">
<meta name="twitter:image:alt" content="{{ og_image_alt }}">
